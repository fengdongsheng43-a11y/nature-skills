name: WR PubMed DOI metadata rescue
on:
  push:
    branches:
      - feature/nature-journal-trends
    paths:
      - .github/workflows/wr-pubmed-qa.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore frozen OpenAlex corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p skills/nature-journal-trends/data/latest
          gh run download 39550517919 --name wr-est-census-2026-10-21 --dir skills/nature-journal-trends/data/latest
          test -s skills/nature-journal-trends/data/latest/paper_index.csv
      - name: Cross-check Water Research abstracts and PubMed document types by DOI
        run: python skills/nature-journal-trends/scripts/enrich_pubmed_wr.py
      - name: Upload reproducible DOI audit, no bulk abstract redistribution
        uses: actions/upload-artifact@v4
        with:
          name: wr-pubmed-doi-audit-2026-10-21
          path: skills/nature-journal-trends/data/enrichment/
          retention-days: 30
      - name: Publish verified DOI metadata counts to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -s skills/nature-journal-trends/data/enrichment/PUBMED_MANIFEST.json
          git add skills/nature-journal-trends/data/enrichment/PUBMED_MANIFEST.json
          git add skills/nature-journal-trends/data/enrichment/wr_pubmed_doi_metadata.csv
          git commit -m "data: PubMed DOI source audit for WR [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin feature/nature-journal-trends
            git rebase origin/feature/nature-journal-trends
            if git push origin HEAD:feature/nature-journal-trends; then exit 0; fi
            sleep 3
          done
          echo "Publication failed, but the archived QA artifact remains available."
          exit 1
