name: Fix research partner index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-research-partner-index.yml

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update README indexes
        shell: python
        run: |
          from pathlib import Path

          replacements = [
              (
                  Path("README.md"),
                  "skills-19-0ea5e9",
                  "skills-20-0ea5e9",
                  "| [`nature-proposal-writer`](skills/nature-proposal-writer/README.md)",
                  '| [`nature-research-partner`](skills/nature-research-partner/README.md) | Draft | 科研发现搭档：把片面灵感、异常现象和未成熟方向重构为可证伪、可追溯、可实验验证并持续更新的论文级科学问题 | “research partner”, “科研搭档”, “科学问题重构”, “竞争假设”, “反证审查”, “证据化设计” | [详情](skills/nature-research-partner/README.md) |',
              ),
              (
                  Path("README_EN.md"),
                  "skills-19-0ea5e9",
                  "skills-20-0ea5e9",
                  "| [`nature-proposal-writer`](skills/nature-proposal-writer/README_EN.md)",
                  '| [`nature-research-partner`](skills/nature-research-partner/README_EN.md) | Draft | Scientific Discovery Partner that reconstructs rough ideas into falsifiable, literature-traceable, evidence-designed research programs with rival hypotheses and persistent research-state updates | "research partner", "scientific discovery", "problem reconstruction", "rival hypotheses", "falsification", "evidence design" | [Details](skills/nature-research-partner/README_EN.md) |',
              ),
          ]

          for path, old_badge, new_badge, anchor, row in replacements:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_badge, new_badge, 1)
              if "nature-research-partner" not in text:
                  lines = text.splitlines()
                  insert_at = next(i + 1 for i, line in enumerate(lines) if anchor in line)
                  lines.insert(insert_at, row)
                  text = "\n".join(lines) + "\n"
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/fix-research-partner-index.yml").unlink()
      - name: Validate
        run: |
          python -m pip install pyyaml
          python scripts/validate-skill-metadata.py
          python scripts/validate-readmes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: register nature-research-partner in skill index"
          git push origin main
